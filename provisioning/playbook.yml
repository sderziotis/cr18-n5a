---

- name: Provision uservm (victim workstation)
  hosts: uservm
  become: true
  gather_facts: true

  handlers:
    - name: Restart SSH
      ansible.builtin.systemd:
        name: ssh
        state: restarted

  tasks:
    # --- apt reliability: keep auto-updates from holding the dpkg lock --------
    - name: Disable and mask unattended-upgrades
      ansible.builtin.systemd:
        name: unattended-upgrades
        state: stopped
        enabled: false
        masked: true
      failed_when: false

    - name: Wait for any apt/dpkg lock to release
      ansible.builtin.shell: >
        while fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock
        /var/cache/apt/archives/lock /var/lib/dpkg/lock >/dev/null 2>&1; do sleep 3; done
      changed_when: false
      failed_when: false


    # --- SSH server with password auth (needed for brute-force + pivot) -------
    - name: Install OpenSSH server
      ansible.builtin.apt:
        name: openssh-server
        state: present
        update_cache: true

    - name: Enable PasswordAuthentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication yes'
      notify: Restart SSH

    - name: Disable root SSH login
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
      notify: Restart SSH

    # AllowTcpForwarding must stay on: the A4 pivot tunnels 8080 *through* here.
    - name: Ensure TCP forwarding is allowed (needed for the pivot tunnel)
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?AllowTcpForwarding'
        line: 'AllowTcpForwarding yes'
      notify: Restart SSH

    - name: Start and enable SSH
      ansible.builtin.systemd:
        name: ssh
        state: started
        enabled: true

    # --- victim account with a deliberately weak password ---------------------
    - name: Create victim user jdoe (weak password, no sudo)
      ansible.builtin.user:
        name: jdoe
        password: "{{ 'letmein123' | password_hash('sha512') }}"
        shell: /bin/bash
        create_home: true

    # Preserve the seeded bash_history: point HISTFILE at /dev/null for
    # interactive logins so the trainee's own session never overwrites it.
    - name: Keep interactive sessions from overwriting bash_history
      ansible.builtin.lineinfile:
        path: /home/jdoe/.bashrc
        line: 'export HISTFILE=/dev/null'
        create: true
        owner: jdoe
        group: jdoe

    - name: Seed jdoe bash_history (leaks server IP + admin username)
      ansible.builtin.copy:
        dest: /home/jdoe/.bash_history
        owner: jdoe
        group: jdoe
        mode: '0600'
        content: |
          ls
          ip a
          ping -c1 192.168.0.4
          ssh admin@192.168.0.4
          ssh -i ~/.ssh/id_rsa admin@192.168.0.4
          cat /etc/hostname
          clear

    # --- SSH key that is reused to authenticate to the server -----------------
    - name: Create jdoe .ssh directory
      ansible.builtin.file:
        path: /home/jdoe/.ssh
        state: directory
        owner: jdoe
        group: jdoe
        mode: '0700'

    - name: Generate jdoe SSH keypair
      ansible.builtin.command:
        cmd: ssh-keygen -t rsa -b 2048 -N "" -C "jdoe@uservm" -f /home/jdoe/.ssh/id_rsa
        creates: /home/jdoe/.ssh/id_rsa

    - name: Fix ownership/permissions on the private key
      ansible.builtin.file:
        path: /home/jdoe/.ssh/id_rsa
        owner: jdoe
        group: jdoe
        mode: '0600'

    - name: Fix ownership on the public key
      ansible.builtin.file:
        path: /home/jdoe/.ssh/id_rsa.pub
        owner: jdoe
        group: jdoe
        mode: '0644'

    # ssh_flag lives as a trailing comment after the key block. OpenSSH ignores
    # any text after -----END...----- so the key still works; `cat id_rsa` shows it.
    # Its own file in .ssh rather than a comment appended to id_rsa. A stray
    # line after the END marker is a format risk on a key the next level has to
    # load, and a flag is not what an SSH key looks like.
    - name: Plant ssh_flag alongside the key
      ansible.builtin.copy:
        content: "{{ ssh_flag }}
"
        dest: /home/jdoe/.ssh/flag.txt
        owner: jdoe
        group: jdoe
        mode: '0600'

    - name: Read jdoe public key (for servervm authorized_keys)
      ansible.builtin.slurp:
        src: /home/jdoe/.ssh/id_rsa.pub
      register: jdoe_pub


# ----------------------------------------------------------------------------
#  SERVERVM (192.168.0.4) — internal server
#    * accepts jdoe's reused key as 'admin' (T1021.004 / T1078)
#    * message.txt advertises the LAN-only Flask panel
#    * Flask maintenance panel on :8080, reachable ONLY from the workstation
#    * ufw blocks the attacker (.3) -> forces the pivot through uservm (T1090)
# ----------------------------------------------------------------------------
- name: Provision servervm (internal server)
  hosts: servervm
  become: true
  gather_facts: true

  handlers:
    - name: Restart SSH
      ansible.builtin.systemd:
        name: ssh
        state: restarted

  tasks:
    - name: Disable and mask unattended-upgrades
      ansible.builtin.systemd:
        name: unattended-upgrades
        state: stopped
        enabled: false
        masked: true
      failed_when: false

    - name: Wait for any apt/dpkg lock to release
      ansible.builtin.shell: >
        while fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock
        /var/cache/apt/archives/lock /var/lib/dpkg/lock >/dev/null 2>&1; do sleep 3; done
      changed_when: false
      failed_when: false

    - name: Install OpenSSH server, Python/Flask, ufw
      ansible.builtin.apt:
        name:
          - openssh-server
          - python3
          - python3-flask
          - ufw
        state: present
        update_cache: true

    - name: Start and enable SSH
      ansible.builtin.systemd:
        name: ssh
        state: started
        enabled: true

    # --- admin account that trusts the workstation's reused key ---------------
    - name: Create admin user
      ansible.builtin.user:
        name: admin
        password: "{{ 'S3rv3rAdm1n!' | password_hash('sha512') }}"
        shell: /bin/bash
        create_home: true

    - name: Create admin .ssh directory
      ansible.builtin.file:
        path: /home/admin/.ssh
        state: directory
        owner: admin
        group: admin
        mode: '0700'

    - name: Authorize the reused workstation key for admin
      ansible.builtin.copy:
        dest: /home/admin/.ssh/authorized_keys
        content: "{{ hostvars['uservm']['jdoe_pub']['content'] | b64decode }}"
        owner: admin
        group: admin
        mode: '0600'

    # --- administrator's message (contains the name + panel pointer) ----------
    - name: Write message.txt (admin message)
      ansible.builtin.copy:
        dest: /home/admin/message.txt
        owner: admin
        group: admin
        mode: '0644'
        content: |
          Admin message:
          Reminder: The Flask-based maintenance panel is running on 192.168.0.4:8080.
          Log in with the 'maintenance' service account.
          Access is restricted to internal hosts only.

          - Mark Stevens, System Administrator

    # --- Flask maintenance panel (LAN-bound, brute-forceable login) -----------
    # The panel runs as its own account, not as admin. admin is the shell the
    # trainee gets at the key-reuse stage, and app.py holds panel_flag in
    # cleartext - if admin could read the file, the brute-force and the tunnel
    # that this level is built around could both be skipped with one cat.
    - name: Create the panel service account
      ansible.builtin.user:
        name: panelsvc
        system: true
        shell: /usr/sbin/nologin
        create_home: false
        password: '!'
        state: present

    - name: Create panel directory
      ansible.builtin.file:
        path: /opt/panel
        state: directory
        mode: '0755'

    - name: Deploy maintenance panel app
      ansible.builtin.copy:
        dest: /opt/panel/app.py
        owner: panelsvc
        group: panelsvc
        mode: '0600'
        content: |
          from flask import Flask, redirect, request

          app = Flask(__name__)
          USERNAME = "maintenance"
          PASSWORD = "admin123"
          FLAG = "{{ panel_flag }}"

          PAGE = """<!doctype html>
          <html>
          <head>
          <title>Maintenance Panel</title>
          <style>
          body { font-family: Helvetica, Arial, sans-serif; background: #eceef0;
                 margin: 0; padding: 70px 0; color: #222; }
          .box { width: 300px; margin: 0 auto; background: #fff;
                 border: 1px solid #c8ccd0; padding: 22px 24px 26px; }
          h1 { font-size: 15px; margin: 0 0 3px; }
          .sub { font-size: 11px; color: #777; margin: 0 0 18px; }
          label { display: block; font-size: 12px; margin-bottom: 11px; }
          input[type=text], input[type=password] { width: 100%%; padding: 5px;
                 margin-top: 3px; box-sizing: border-box; border: 1px solid #bbb; }
          input[type=submit] { margin-top: 4px; padding: 5px 15px; }
          .err { color: #a30000; font-size: 12px; margin: 0 0 12px; }
          </style>
          </head>
          <body>
          <div class="box">
          <h1>Maintenance Panel</h1>
          <p class="sub">Authorised personnel only. Internal network access required.</p>
          %s<form method="POST" action="/login">
          <label>Username<input type="text" name="username" autofocus></label>
          <label>Password<input type="password" name="password"></label>
          <input type="submit" value="Log in">
          </form>
          </div>
          </body>
          </html>
          """

          @app.route("/")
          def index():
              return redirect("/login", code=302)

          @app.route("/login", methods=["GET", "POST"])
          def login():
              if request.method == "POST":
                  u = request.form.get("username", "")
                  p = request.form.get("password", "")
                  if u == USERNAME and p == PASSWORD:
                      return "Access granted. Maintenance flag: %s\n" % FLAG, 200
                  # "Unauthorized" is the string hydra matches a failed login on.
                  # Keep it off the success path or every attempt reads as a failure.
                  return PAGE % '<p class="err">Unauthorized</p>', 200
              return PAGE % "", 200

          if __name__ == "__main__":
              # threaded=True so the dev server survives parallel hydra requests
              app.run(host="0.0.0.0", port=8080, threaded=True)

    - name: Create systemd unit for the panel
      ansible.builtin.copy:
        dest: /etc/systemd/system/maintenance-panel.service
        mode: '0644'
        content: |
          [Unit]
          Description=Maintenance Panel
          After=network.target

          [Service]
          ExecStart=/usr/bin/python3 /opt/panel/app.py
          Restart=always
          User=panelsvc

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start the panel
      ansible.builtin.systemd:
        name: maintenance-panel
        state: started
        enabled: true
        daemon_reload: true

    # --- network segmentation -------------------------------------------------
    # IMPORTANT: default policy is left as ALLOW so we do NOT cut off the
    # provisioning/management connection (which does not originate from .10).
    # We then explicitly DENY the attacker box (.3) to ports 22 and 8080, which
    # is what forces the trainee to pivot through the workstation (.10).
    - name: Default policies (allow) — preserves the management plane
      community.general.ufw:
        direction: "{{ item }}"
        policy: allow
      loop:
        - incoming
        - outgoing

    - name: Allow workstation (.10) to SSH + panel
      community.general.ufw:
        rule: allow
        src: 192.168.0.10
        port: "{{ item }}"
        proto: tcp
      loop:
        - '22'
        - '8080'

    - name: Block attacker (.3) from direct SSH + panel (force the pivot)
      community.general.ufw:
        rule: deny
        src: 192.168.0.3
        port: "{{ item }}"
        proto: tcp
      loop:
        - '22'
        - '8080'

    - name: Enable ufw
      community.general.ufw:
        state: enabled


# ----------------------------------------------------------------------------
#  VMA (192.168.0.3) — attacker workstation
#    * recon + attack tooling
#    * seeded, tuned wordlists so both brute-forces resolve in seconds
#    * trainee console account: user / Password123
# ----------------------------------------------------------------------------
- name: Provision vma (attacker)
  hosts: vma
  become: true
  gather_facts: true

  roles:
    # Reuses your framework's account role for the interactive console login.
    - role: user-access
      user_access_username: user
      user_access_password: 'Password123'
      user_access_sudo: true

  tasks:
    # Kali boots with a stack-prefixed hostname that /etc/hosts does not
    # resolve, so every sudo call prints "unable to resolve host" first.
    # The base image ships '127.0.1.1 kali.kali kali'. The platform renames the
    # host, so that alias is stale, and the task below manages only its own line -
    # which leaves two 127.0.1.1 entries and tells anyone who reads /etc/hosts that
    # this is a stock Kali image rather than a company workstation.
    - name: Drop the base image's leftover 127.0.1.1 alias
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s+kali'
        state: absent

    - name: Ensure /etc/hosts resolves the renamed hostname
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\b'
        line: "127.0.1.1 {{ ansible_hostname }}"
        state: present

    - name: Disable and mask unattended-upgrades
      ansible.builtin.systemd:
        name: unattended-upgrades
        state: stopped
        enabled: false
        masked: true
      failed_when: false

    - name: Wait for any apt/dpkg lock to release
      ansible.builtin.shell: >
        timeout 300 sh -c 'while fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock
        /var/cache/apt/archives/lock /var/lib/dpkg/lock >/dev/null 2>&1; do sleep 3; done'
      changed_when: false
      failed_when: false

    - name: Install recon + attack tooling
      ansible.builtin.apt:
        name:
          - arp-scan
          - nmap
          - hydra
          - openssh-client
          - curl
        state: present
        update_cache: true

    - name: Ensure Desktop directory exists
      ansible.builtin.file:
        path: /home/user/Desktop
        state: directory
        owner: user
        group: user
        mode: '0755'

    # Seeded wordlists. Correct answers sit near the TOP so hydra finishes in
    # seconds; keep hydra at -t 4 (SSH) / -t 8 (HTTP) for deterministic timing.
    - name: Stage users.txt
      ansible.builtin.copy:
        dest: /home/user/Desktop/users.txt
        owner: user
        group: user
        mode: '0644'
        content: |
          admin
          root
          jdoe
          user
          ubuntu
          msmith
          test
          operator
          guest
          service

    - name: Stage passwords.txt
      ansible.builtin.copy:
        dest: /home/user/Desktop/passwords.txt
        owner: user
        group: user
        mode: '0644'
        content: |
          123456
          password
          letmein123
          qwerty
          welcome
          changeme
          admin
          root123
          P@ssw0rd
          summer2024

    - name: Stage wordlist.txt (maintenance panel passwords)
      ansible.builtin.copy:
        dest: /home/user/Desktop/wordlist.txt
        owner: user
        group: user
        mode: '0644'
        content: |
          password
          admin
          admin123
          maintenance
          letmein
          123456
          toor
          service123

    - name: Mirror wordlists into home directory
      ansible.builtin.copy:
        src: "/home/user/Desktop/{{ item }}"
        dest: "/home/user/{{ item }}"
        remote_src: true
        owner: user
        group: user
        mode: '0644'
      loop:
        - users.txt
        - passwords.txt
        - wordlist.txt

# ----------------------------------------------------------------------------
#  Belt-and-suspenders: fully disable apt auto-update/upgrade on ALL hosts.
#  (Common base setup already disables the unattended-upgrades service; this
#  additionally blanks the periodic-update config and stops/masks the
#  apt-daily timers so nothing re-triggers apt mid-lab.)
# ----------------------------------------------------------------------------
- name: Disable apt auto-update everywhere
  hosts: all
  become: true
  tasks:
    - name: Disable unattended upgrades in apt periodic config
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "0";
          APT::Periodic::Unattended-Upgrade "0";

    - name: Disable apt daily timers
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
        masked: true
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer
      failed_when: false
